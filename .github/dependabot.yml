version: 2

updates:
  - package-ecosystem: docker
    directory: /
    groups:
      docker-actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    schedule:
      interval: monthly
      timezone: US/Arizona
    cooldown:
      default-days: 2
    assignees: [PHLAK]

  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions-minor-and-patch:
        patterns: ['*']
        update-types: [major, minor, patch]
    schedule:
      interval: monthly
    cooldown:
      default-days: 2
    assignees: [PHLAK]
